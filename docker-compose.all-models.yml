# Explicit opt-in: docker compose -f docker-compose.yml -f docker-compose.all-models.yml ...
services:
  postgres:
    ports: !reset []
  backend:
    image: deeptrace-backend:all-models
    build:
      context: ./backend
      dockerfile: Dockerfile.all-models
    environment:
      DEEPTRACE_DEPLOYMENT_MODE: ${DEEPTRACE_DEPLOYMENT_MODE:-local}
      DEEPTRACE_FRONTEND_ORIGINS: ${DEEPTRACE_FRONTEND_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DEEPTRACE_LOCAL_AUTO_LOGIN: "false"
      DEEPTRACE_AASIST_WINDOW_MODE: "full"
      DEEPTRACE_PARALLEL_REVIEW_CHECKS: ${DEEPTRACE_PARALLEL_REVIEW_CHECKS:-false}
      DEEPTRACE_EFFICIENTNET_DECISION_RULE: "ffpp_c23_kaggle_v1"
      DEEPTRACE_FRAME_INTERVAL_SECONDS: "1"
      DEEPTRACE_MAX_FRAMES: "120"
      DEEPTRACE_GAN_ARTIFACT_COMMAND: "python /app/scripts/inference/cnn_artifacts.py --repo /app/vendor/CNNDetection --weights /app/models/cnn_artifacts/blur_jpg_prob0.5.pth --frames {frames_dir} --device cpu"
      DEEPTRACE_VOCODER_ARTIFACT_COMMAND: "python /app/scripts/inference/lfcc_lcnn.py --repo /app/vendor/asvspoof2021 --weights /app/models/lfcc_lcnn/df_trained_network.pt --audio {audio_path} --device cpu"
      DEEPTRACE_REVIEW_SIGNALS_COMMAND: "python /app/scripts/inference/review_signals.py --media {media_path} --landmarks /app/models/efficientnetb4/shape_predictor_81_face_landmarks.dat --max-seconds 30"
      DEEPTRACE_MICRO_EXPRESSION_COMMAND: "python /app/scripts/inference/softnet.py --repo /app/vendor/SoftNet-SpotME --weights /app/models/softnet/CASME_micro_s1.hdf5 --landmarks /app/vendor/SoftNet-SpotME/Utils/shape_predictor_68_face_landmarks.dat --media {media_path} --max-seconds 30"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "2"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.team
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
