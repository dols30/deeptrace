[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptrace-poc"
version = "0.1.0"
description = "Advisory audio/video authenticity screening PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "python-multipart==0.0.20",
  "pydantic-settings==2.9.1",
  "uvicorn[standard]==0.34.2",
  "PyJWT[crypto]==2.10.1",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.6",
]

[tool.setuptools.packages.find]
include = ["deeptrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

