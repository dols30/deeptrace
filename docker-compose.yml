# One stack for the Mac and the AWS GPU host. The env file decides the differences:
#   Mac:  .env       (from .env.local.example)  docker compose up --build
#   AWS:  .env.prod  (from .env.prod.example)   docker compose --env-file .env.prod up -d --build
#   - GPU:          COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml plus DEEPTRACE_TORCH_INDEX / DEEPTRACE_DEVICE
#   - Detectors:    DEEPTRACE_MODEL_PROFILE=core (default) or all-models
#   - AWS services: DEEPTRACE_STORAGE_BACKEND=s3 and DEEPTRACE_ASSISTANT_PROVIDER=bedrock
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deeptrace
      POSTGRES_PASSWORD: deeptrace
      POSTGRES_DB: deeptrace
    # No published port: only the backend reaches it, on the compose network.
    volumes:
      - deeptrace-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptrace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: ${DEEPTRACE_MODEL_PROFILE:-core}
      args:
        # Docker builds cannot see the GPU: cpu / cpu on the Mac, cu126 / cuda on the GPU host.
        TORCH_INDEX: ${DEEPTRACE_TORCH_INDEX:-cpu}
        DEEPTRACE_DEVICE: ${DEEPTRACE_DEVICE:-cpu}
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEEPTRACE_DATABASE_URL: postgresql+psycopg://deeptrace:deeptrace@postgres:5432/deeptrace
      DEEPTRACE_DEPLOYMENT_MODE: ${DEEPTRACE_DEPLOYMENT_MODE:-local}
      DEEPTRACE_FRONTEND_ORIGINS: ${DEEPTRACE_FRONTEND_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DEEPTRACE_EXPLAIN: ${DEEPTRACE_EXPLAIN:-false}
      # Orchestration (docs/MODEL_ORCHESTRATION.md).
      DEEPTRACE_MODEL_WORKERS: ${DEEPTRACE_MODEL_WORKERS:-false}
      DEEPTRACE_MAX_PARALLEL_RUNNERS: ${DEEPTRACE_MAX_PARALLEL_RUNNERS:-1}
      # Passed through only when set, so the all-models image keeps its own decision rule.
      DEEPTRACE_EFFICIENTNET_DECISION_RULE:
      # Sign-in
      DEEPTRACE_AUTH_ENABLED: "true"
      DEEPTRACE_AUTH_MODE: employee
      DEEPTRACE_LOCAL_AUTO_LOGIN: ${DEEPTRACE_LOCAL_AUTO_LOGIN:-false}
      DEEPTRACE_EMPLOYEE_USERNAME: ${DEEPTRACE_EMPLOYEE_USERNAME:-dps.employee}
      DEEPTRACE_EMPLOYEE_PASSWORD: ${DEEPTRACE_EMPLOYEE_PASSWORD:?Set DEEPTRACE_EMPLOYEE_PASSWORD in the root .env file}
      DEEPTRACE_SUPERVISOR_USERNAME: ${DEEPTRACE_SUPERVISOR_USERNAME:-dps.supervisor}
      DEEPTRACE_SUPERVISOR_PASSWORD: ${DEEPTRACE_SUPERVISOR_PASSWORD:?Set DEEPTRACE_SUPERVISOR_PASSWORD in the root .env file}
      DEEPTRACE_JWT_SECRET: ${DEEPTRACE_JWT_SECRET:?Set DEEPTRACE_JWT_SECRET in the root .env file}
      # Case assistant
      DEEPTRACE_ASSISTANT_PROVIDER: ${DEEPTRACE_ASSISTANT_PROVIDER:-rules}
      DEEPTRACE_GEMINI_API_KEY: ${DEEPTRACE_GEMINI_API_KEY:-}
      DEEPTRACE_GEMINI_MODEL: ${DEEPTRACE_GEMINI_MODEL:-gemini-2.5-flash}
      DEEPTRACE_BEDROCK_REGION: ${DEEPTRACE_BEDROCK_REGION:-}
      DEEPTRACE_BEDROCK_ANSWER_MODEL: ${DEEPTRACE_BEDROCK_ANSWER_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      DEEPTRACE_BEDROCK_VIDEO_MODEL: ${DEEPTRACE_BEDROCK_VIDEO_MODEL:-us.amazon.nova-lite-v1:0}
      # Media storage (docs/S3_STORAGE.md)
      DEEPTRACE_STORAGE_BACKEND: ${DEEPTRACE_STORAGE_BACKEND:-local}
      DEEPTRACE_S3_BUCKET: ${DEEPTRACE_S3_BUCKET:-}
      DEEPTRACE_S3_PREFIX: ${DEEPTRACE_S3_PREFIX:-deeptrace}
      DEEPTRACE_AWS_REGION: ${DEEPTRACE_AWS_REGION:-}
      # AWS credentials. On EC2 leave all of these unset and the instance role is used. They have no
      # value here on purpose: they are passed through only when set, because botocore treats even an
      # empty string as a credential and would then skip the instance role.
      # On the Mac, set either a Bedrock API key (assistant only) or access keys (S3 and Bedrock).
      AWS_BEARER_TOKEN_BEDROCK:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
    volumes:
      - deeptrace-uploads:/tmp/deeptrace-uploads
      - deeptrace-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time: the API URL as the browser sees it.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  deeptrace-uploads:
  deeptrace-data:
  deeptrace-pg:
